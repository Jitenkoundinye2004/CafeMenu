<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        #qrcode img { margin: 0 auto; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-gray-100">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2">QR Generator</h1>
        <p class="text-gray-500 mb-8 text-sm">Enter any URL or text to instantly generate a downloadable QR code.</p>

        <div class="space-y-4">
            <input 
                type="text" 
                id="urlInput" 
                placeholder="https://www.brewandbean.com/?table=1" 
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow"
            />
            
            <button 
                onclick="generateQR()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-sm"
            >
                Generate QR Code
            </button>
        </div>

        <!-- QR Code Display Area -->
        <div id="qrContainer" class="mt-8 hidden flex-col items-center">
            <div class="bg-white p-4 border border-gray-100 rounded-xl shadow-sm inline-block mb-4">
                <div id="qrcode"></div>
            </div>
            <button 
                onclick="downloadQR()"
                class="text-blue-600 font-medium hover:text-blue-800 underline text-sm"
            >
                Download Image
            </button>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById('qrContainer');
        const qrcodeDiv = document.getElementById('qrcode');
        let qr = null;

        function generateQR() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert("Please enter a URL first!");
                return;
            }

            // Clear previous QR code
            qrcodeDiv.innerHTML = '';
            
            // Generate new QR code
            qr = new QRCode(qrcodeDiv, {
                text: url,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Show container
            qrContainer.classList.remove('hidden');
            qrContainer.classList.add('flex');
        }

        function downloadQR() {
            // QRCode.js creates an HTML canvas and an img tag. 
            // We can grab the img source (base64) to trigger a download.
            const img = qrcodeDiv.querySelector('img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = 'QR-Code.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                // Fallback for canvas if img isn't generated fast enough
                const canvas = qrcodeDiv.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL("image/png");
                    link.download = 'QR-Code.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
        
        // Allow pressing Enter key to generate
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
